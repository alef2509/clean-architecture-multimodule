name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build (enforcer guards the core), unit, adapter and end-to-end tests
        run: ./mvnw -B verify
      - name: Build container image
        run: docker build --build-arg MODULE=library-app -t library:ci .
